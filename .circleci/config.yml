version: 2.1

jobs:
  lint:
    docker:
      - image: randomgraphics/rapid-vulkan:latest
    steps:
      - run:
          name: prep git
          command: |
            git config --global --add safe.directory /tmp/_circleci_local_build_repo
            git config --global --add safe.directory /root/project
      - checkout
      - run: dev/bin/cit.py -l

  build-linux-gcc-with-cit:
    docker:
      - image: randomgraphics/rapid-vulkan:latest
    steps:
      - run:
          name: prep git
          command: |
            git config --global --add safe.directory /tmp/_circleci_local_build_repo
            git config --global --add safe.directory /root/project
      - checkout
      - run:
          name: build
          command: |
            source dev/env/env.rc
            build.py d
            build.py p
            build.py r
            build/linux.gcc.d/dev/test/rapid-vulkan-test
            build/linux.gcc.p/dev/test/rapid-vulkan-test
            build/linux.gcc.r/dev/test/rapid-vulkan-test

  build-linux-clang:
    docker:
      - image: randomgraphics/rapid-vulkan:latest
    steps:
      - run:
          name: prep git
          command: |
            git config --global --add safe.directory /tmp/_circleci_local_build_repo
            git config --global --add safe.directory /root/project
      - checkout
      - run:
          name: build
          command: |
            source dev/env/env.rc
            build.py --clang -n d
            build.py --clang -n p
            build.py --clang -n r

  build-windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    environment:
      WINDOWS_BUILD_IMAGE: randomgraphics/garnet-windows:00001
    steps:
      - checkout
      - run:
          name: Hydrate source dependencies
          command: |
            $ErrorActionPreference = 'Stop'
            git submodule update --init --recursive --depth 1
            if ($LASTEXITCODE -ne 0) { throw 'Submodule checkout failed' }
            git lfs pull
            if ($LASTEXITCODE -ne 0) { throw 'Git LFS checkout failed' }
      - run:
          name: Compile with published Windows image
          command: |
            $source = (Get-Location).Path
            docker run --rm --isolation process `
              --mount "type=bind,source=$source,target=C:\rapid-vulkan" `
              --workdir C:\rapid-vulkan $env:WINDOWS_BUILD_IMAGE `
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\rapid-vulkan\dev\docker\windows\ci-build.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Windows container build failed' }

  build-android:
    docker:
      - image: randomgraphics/rapid-vulkan:android-latest
    steps:
      - run:
          name: prep git
          command: |
            git config --global --add safe.directory /tmp/_circleci_local_build_repo
            git config --global --add safe.directory /root/project
      - checkout
      - run:
          name: build
          command: |
            source dev/env/env.rc
            build.py -a d
            build.py -a p
            build.py -a r

workflows:
  build-and-test:
    jobs:
      - lint
      - build-linux-gcc-with-cit:
          requires:
            - lint
      - build-linux-clang:
          requires:
            - lint
      - build-windows:
          requires:
            - lint
      - build-android:
          requires:
            - lint
