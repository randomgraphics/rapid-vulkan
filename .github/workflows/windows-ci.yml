name: Windows CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - name: Clone Repo
        uses: actions/checkout@v3
#     - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - name: Get Vulkan SDK version
        id: vulkan-version
        run: |
          $version = (Get-Content vulkan-sdk-version.txt).Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\dev\vulkan-sdk\${{ steps.vulkan-version.outputs.version }}
          key: vulkan-sdk-windows-${{ steps.vulkan-version.outputs.version }}
      - name: Install Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path C:\dev\vulkan-sdk | Out-Null
          Invoke-WebRequest -Uri "https://github.com/randomgraphics/vulkan-sdk-for-windows/releases/download/v${{ steps.vulkan-version.outputs.version }}/vulkan-sdk-for-windows-${{ steps.vulkan-version.outputs.version }}.zip" -OutFile vulkan-sdk.zip
          Expand-Archive -Path vulkan-sdk.zip -DestinationPath C:\dev\vulkan-sdk
          Move-Item -Path "C:\dev\vulkan-sdk\vulkan-sdk-for-windows" -Destination "C:\dev\vulkan-sdk\${{ steps.vulkan-version.outputs.version }}"
          Remove-Item vulkan-sdk.zip
      - name: Install Other Dependencies
        run: python.exe -m pip install --upgrade termcolor
      - name: Build
        shell: powershell
        run: |
          $env:VULKAN_SDK="C:\dev\vulkan-sdk\${{ steps.vulkan-version.outputs.version }}"
          . dev\env\env.ps1
          b d
      - run: echo "🍏 This job's status is ${{ job.status }}."